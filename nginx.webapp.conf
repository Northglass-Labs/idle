log_format idle_release '$request_method $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout idle_release;

    # The web client can switch to any user-configured HTTPS relay and uses
    # WebSockets for sync/voice. Plain HTTP remains limited to local self-hosting.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://js.stripe.com https://cdn.paddle.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://*.localhost:* http://127.0.0.1:* http://[::1]:*; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* http://*.localhost:* http://127.0.0.1:* http://[::1]:* ws://localhost:* ws://*.localhost:* ws://127.0.0.1:* ws://[::1]:*; worker-src 'self' blob:; child-src 'self' blob: https://js.stripe.com https://*.stripe.com https://*.stripe.network https://*.paddle.com https://*.revenuecat.com; frame-src 'self' blob: https://js.stripe.com https://*.stripe.com https://*.stripe.network https://*.paddle.com https://*.revenuecat.com; media-src 'self' data: blob: https: http://localhost:* http://*.localhost:* http://127.0.0.1:* http://[::1]:*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Stripe Elements and Paddle Checkout create payment-enabled provider
    # frames. Delegate Payment Request only to their production/sandbox frame
    # origins; never grant the feature to arbitrary third-party frames.
    add_header Permissions-Policy "camera=(self), microphone=(self), payment=(self \"https://js.stripe.com\" \"https://hooks.stripe.com\" \"https://buy.paddle.com\" \"https://sandbox-buy.paddle.com\")" always;
    # Browsers ignore HSTS over the loopback HTTP profile. TLS reverse proxies
    # retain it for hosted and public self-hosted deployments.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /_expo/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /.well-known/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ /index.html /index.htm =404;
    }
}
