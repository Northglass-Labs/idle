name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/idle-cli/**'
      - 'packages/idle-server/**'
      - 'packages/idle-wire/**'
      - 'yarn.lock'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/idle-cli/**'
      - 'packages/idle-server/**'
      - 'packages/idle-wire/**'
      - 'yarn.lock'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        cache-dependency-path: yarn.lock

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build packages
      run: |
        yarn workspace @northglass/idle-server build
        yarn workspace idle-coder build

    - name: Pack packages
      run: |
        PACK_DIR="$RUNNER_TEMP/idle-packs"
        mkdir -p "$PACK_DIR"
        (cd packages/idle-server && npm pack --pack-destination "$PACK_DIR")
        (cd packages/idle-cli && npm pack --pack-destination "$PACK_DIR")
        echo "Packed files:"
        find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print

    - name: Install packed packages globally
      run: |
        npm install -g "$RUNNER_TEMP"/idle-packs/northglass-idle-server-*.tgz "$RUNNER_TEMP"/idle-packs/idle-coder-*.tgz

    - name: Test binary execution
      run: |
        # Test that the binary starts successfully
        echo "Testing idle --help..."
        timeout 30s idle --help || {
          echo "Error: idle --help failed or timed out"
          exit 1
        }

        echo "Testing idle --version..."
        timeout 10s idle --version || {
          echo "Error: idle --version failed or timed out"
          exit 1
        }

        echo "Testing idle doctor..."
        timeout 30s idle doctor || {
          echo "Error: idle doctor failed or timed out"
          exit 1
        }

        echo "Testing idle daemon status..."
        timeout 10s idle daemon status || {
          echo "Error: idle daemon status failed or timed out"
          exit 1
        }

        echo "Binary smoke test passed on Linux!"

    - name: Test packaged server (idle server)
      run: |
        export IDLE_HOME_DIR="$(mktemp -d)"
        setsid timeout 120s idle server --port 4505 --host 127.0.0.1 --no-persist --reset > /tmp/idle-server.log 2>&1 &
        SERVER_PID=$!
        UP=0
        for i in $(seq 1 90); do
          if curl -sf -m 2 http://127.0.0.1:4505/ -o /dev/null; then UP=1; echo "server up after ${i}s"; break; fi
          sleep 1
        done
        # Exercise the Prisma native query engine via a DB-backed read.
        PK=$(node -e "console.log(Buffer.alloc(32).toString('base64'))")
        BODY=$(curl -s -m 5 -G http://127.0.0.1:4505/v1/auth/request/status --data-urlencode "publicKey=$PK" || true)
        echo "auth/request/status -> $BODY"
        kill -- -"$SERVER_PID" 2>/dev/null || true
        echo "=== idle server log ==="; cat /tmp/idle-server.log || true
        if [ "$UP" != "1" ]; then echo "Error: idle server did not become healthy"; exit 1; fi
        if ! echo "$BODY" | grep -q '"status"'; then echo "Error: Prisma-backed endpoint did not respond"; exit 1; fi
        if grep -qiE 'PrismaClientInitializationError|could not locate.*Query Engine' /tmp/idle-server.log; then echo "Error: Prisma query engine failed to load"; exit 1; fi
        echo "idle server smoke test passed (booted + Prisma query engine OK)"

  smoke-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        cache-dependency-path: yarn.lock

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build packages
      run: |
        yarn workspace @northglass/idle-server build
        yarn workspace idle-coder build

    - name: Pack packages
      shell: cmd
      run: |
        if not exist "%RUNNER_TEMP%\idle-packs" mkdir "%RUNNER_TEMP%\idle-packs"
        pushd packages\idle-server
        npm pack --pack-destination "%RUNNER_TEMP%\idle-packs"
        popd
        pushd packages\idle-cli
        npm pack --pack-destination "%RUNNER_TEMP%\idle-packs"
        popd

    - name: Install packed packages globally
      shell: cmd
      run: |
        for %%f in ("%RUNNER_TEMP%\idle-packs\northglass-idle-server-*.tgz") do set SERVER_PACKAGE=%%f
        for %%f in ("%RUNNER_TEMP%\idle-packs\idle-coder-*.tgz") do set CLI_PACKAGE=%%f
        npm install -g "%SERVER_PACKAGE%" "%CLI_PACKAGE%"

    - name: Debug npm global installation structure
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Listing npm prefix directory:
        dir "%NPM_PREFIX%" 2>nul || echo Failed to list NPM_PREFIX
        echo.
        echo Checking for node_modules in npm prefix:
        if exist "%NPM_PREFIX%\node_modules" (
          echo Found node_modules directory
          dir "%NPM_PREFIX%\node_modules" 2>nul
          echo.
          echo Checking for idle-coder package:
          if exist "%NPM_PREFIX%\node_modules\idle-coder" (
            echo Found idle-coder package
            dir "%NPM_PREFIX%\node_modules\idle-coder" 2>nul
            echo.
            echo Checking for dist directory:
            if exist "%NPM_PREFIX%\node_modules\idle-coder\dist" (
              echo Found dist directory
              dir "%NPM_PREFIX%\node_modules\idle-coder\dist" 2>nul
            ) else (
              echo No dist directory found
            )
          ) else (
            echo No idle-coder package found
          )
        ) else (
          echo No node_modules directory found
        )

    - name: Test binary execution
      shell: cmd
      run: |
        @echo on

        rem Get npm global prefix and add to PATH
        for /f "tokens=*" %%i in ('npm config get prefix') do set NPM_PREFIX=%%i
        set PATH=%NPM_PREFIX%;%PATH%
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Current PATH: %PATH%

        rem Debug: Check if idle exists in various locations
        echo Checking for idle binary...
        where idle 2>nul && echo Found idle in PATH || echo idle not found in PATH
        if exist "%NPM_PREFIX%\idle.cmd" echo Found idle.cmd in NPM_PREFIX
        if exist "%NPM_PREFIX%\node_modules\.bin\idle.cmd" echo Found idle.cmd in .bin directory
        dir "%NPM_PREFIX%\*idle*" 2>nul || echo No idle files found in NPM_PREFIX

        rem Debug: Check the actual contents and encoding of the installed file
        if exist "%NPM_PREFIX%\idle.cmd" (
          echo File size and type:
          dir "%NPM_PREFIX%\idle.cmd"
          echo.
          echo First few lines of the file:
          type "%NPM_PREFIX%\idle.cmd" | head -5
          echo.
          echo Hex dump of first 50 bytes to check line endings:
          powershell -Command "Get-Content '%NPM_PREFIX%\idle.cmd' -Encoding Byte -TotalCount 50 | ForEach-Object { '{0:X2}' -f $_ } | Join-String -Separator ' '"
          echo.
          echo Testing with direct path...
          "%NPM_PREFIX%\idle.cmd" --help
        ) else (
          echo Testing idle --help...
          idle --help
        )
        if errorlevel 1 (
          echo Error: idle --help failed
          exit /b 1
        )

        rem Test version
        if exist "%NPM_PREFIX%\idle.cmd" (
          "%NPM_PREFIX%\idle.cmd" --version
        ) else (
          idle --version
        )
        if errorlevel 1 (
          echo Error: idle --version failed
          exit /b 1
        )

        rem Test doctor
        echo Testing idle doctor...
        if exist "%NPM_PREFIX%\idle.cmd" (
          "%NPM_PREFIX%\idle.cmd" doctor
        ) else (
          idle doctor
        )
        if errorlevel 1 (
          echo Error: idle doctor failed
          exit /b 1
        )

        rem Test daemon status
        echo Testing idle daemon status...
        if exist "%NPM_PREFIX%\idle.cmd" (
          "%NPM_PREFIX%\idle.cmd" daemon status
        ) else (
          idle daemon status
        )
        if errorlevel 1 (
          echo Error: idle daemon status failed
          exit /b 1
        )

        echo Smoke test passed on Windows!
