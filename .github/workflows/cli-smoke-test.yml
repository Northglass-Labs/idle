name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/idle-cli/**'
      - 'packages/idle-server/**'
      - 'packages/idle-wire/**'
      - 'yarn.lock'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/idle-cli/**'
      - 'packages/idle-server/**'
      - 'packages/idle-wire/**'
      - 'yarn.lock'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build packages
      run: |
        yarn workspace @northglass/idle-server build
        yarn workspace idle-coder build

    - name: Pack packages
      run: |
        PACK_DIR="$RUNNER_TEMP/idle-packs"
        mkdir -p "$PACK_DIR"
        (cd packages/idle-server && npm pack --pack-destination "$PACK_DIR")
        (cd packages/idle-cli && npm pack --pack-destination "$PACK_DIR")
        echo "Packed files:"
        find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print

    - name: Install packed packages globally
      run: |
        npm install -g "$RUNNER_TEMP"/idle-packs/northglass-idle-server-*.tgz "$RUNNER_TEMP"/idle-packs/idle-coder-*.tgz

    - name: Test binary execution
      run: |
        # Test that the binary starts successfully
        echo "Testing idle --help..."
        timeout 30s idle --help || {
          echo "Error: idle --help failed or timed out"
          exit 1
        }

        echo "Testing idle --version..."
        timeout 10s idle --version || {
          echo "Error: idle --version failed or timed out"
          exit 1
        }

        echo "Testing idle doctor..."
        timeout 30s idle doctor || {
          echo "Error: idle doctor failed or timed out"
          exit 1
        }

        echo "Testing idle daemon status..."
        timeout 10s idle daemon status || {
          echo "Error: idle daemon status failed or timed out"
          exit 1
        }

        echo "Binary smoke test passed on Linux!"

    - name: Test packaged server (idle server)
      run: |
        export IDLE_HOME_DIR="$(mktemp -d)"
        setsid timeout 120s idle server --port 4505 --host 127.0.0.1 --no-persist --reset > /tmp/idle-server.log 2>&1 &
        SERVER_PID=$!
        UP=0
        for i in $(seq 1 90); do
          if curl -sf -m 2 http://127.0.0.1:4505/ -o /dev/null; then UP=1; echo "server up after ${i}s"; break; fi
          sleep 1
        done
        # Exercise the Prisma native query engine via a DB-backed read.
        PK=$(node -e "console.log(Buffer.alloc(32).toString('base64'))")
        BODY=$(curl -s -m 5 -G http://127.0.0.1:4505/v1/auth/request/status --data-urlencode "publicKey=$PK" || true)
        echo "auth/request/status -> $BODY"
        kill -- -"$SERVER_PID" 2>/dev/null || true
        echo "=== idle server log ==="; cat /tmp/idle-server.log || true
        if [ "$UP" != "1" ]; then echo "Error: idle server did not become healthy"; exit 1; fi
        if ! echo "$BODY" | grep -q '"status"'; then echo "Error: Prisma-backed endpoint did not respond"; exit 1; fi
        if grep -qiE 'PrismaClientInitializationError|could not locate.*Query Engine' /tmp/idle-server.log; then echo "Error: Prisma query engine failed to load"; exit 1; fi
        echo "idle server smoke test passed (booted + Prisma query engine OK)"

  smoke-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build packages
      run: |
        yarn workspace @northglass/idle-server build
        yarn workspace idle-coder build

    - name: Pack packages
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $packDir = Join-Path $env:RUNNER_TEMP 'idle-packs'
        New-Item -ItemType Directory -Force -Path $packDir | Out-Null

        Push-Location 'packages/idle-server'
        try {
          & npm pack --pack-destination $packDir
          if ($LASTEXITCODE -ne 0) { throw 'Server package creation failed' }
        } finally {
          Pop-Location
        }

        Push-Location 'packages/idle-cli'
        try {
          & npm pack --pack-destination $packDir
          if ($LASTEXITCODE -ne 0) { throw 'CLI package creation failed' }
        } finally {
          Pop-Location
        }

    - name: Install packed packages globally
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $packDir = Join-Path $env:RUNNER_TEMP 'idle-packs'
        $serverPackages = @(Get-ChildItem -LiteralPath $packDir -Filter 'northglass-idle-server-*.tgz' -File)
        $cliPackages = @(Get-ChildItem -LiteralPath $packDir -Filter 'idle-coder-*.tgz' -File)
        if ($serverPackages.Count -ne 1) { throw 'Expected exactly one server package' }
        if ($cliPackages.Count -ne 1) { throw 'Expected exactly one CLI package' }
        $serverPackage = $serverPackages[0].FullName
        $cliPackage = $cliPackages[0].FullName

        & npm install --global $serverPackage $cliPackage
        if ($LASTEXITCODE -ne 0) { throw 'Global package installation failed' }

    - name: Test binary execution
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $npmPrefix = (& npm config get prefix).Trim()
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($npmPrefix)) {
          throw 'Unable to resolve the npm global prefix'
        }
        $env:PATH = "$npmPrefix$([IO.Path]::PathSeparator)$env:PATH"
        $idle = Join-Path $npmPrefix 'idle.cmd'
        if (-not (Test-Path -LiteralPath $idle -PathType Leaf)) {
          throw 'Installed Idle command shim was not found'
        }
        if (-not (Test-Path -LiteralPath (Join-Path $npmPrefix 'node_modules/idle-coder/dist') -PathType Container)) {
          throw 'Installed Idle package is missing its runtime bundle'
        }

        Get-Content -LiteralPath $idle -TotalCount 5
        & $idle --help
        if ($LASTEXITCODE -ne 0) { throw 'idle --help failed' }
        & $idle --version
        if ($LASTEXITCODE -ne 0) { throw 'idle --version failed' }
        & $idle doctor
        if ($LASTEXITCODE -ne 0) { throw 'idle doctor failed' }
        & $idle daemon status
        if ($LASTEXITCODE -ne 0) { throw 'idle daemon status failed' }

        Write-Host 'Smoke test passed on Windows'
