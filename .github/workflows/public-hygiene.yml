name: Public repository hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          install -d -m 0700 "$bin_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Scan committed tree and fetched Git history for secrets
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40,64}$ ]]
          git cat-file -e "${HEAD_SHA}^{commit}"
          tree="$RUNNER_TEMP/idle-public-tree"
          install -d -m 0700 "$tree"
          git archive --format=tar "$HEAD_SHA" | tar -xf - -C "$tree"
          scan_args=(
            --redact=100
            --no-banner
            --no-color
            --config "$GITHUB_WORKSPACE/.gitleaks.toml"
            --max-archive-depth=0
            --max-target-megabytes=64
            --timeout=120
          )
          gitleaks dir "${scan_args[@]}" "$tree"
          gitleaks git "${scan_args[@]}" --log-opts="--all" .
      - name: Verify release boundaries
        run: node --test scripts/app-release-boundary.test.mjs scripts/check-upstream-cruft.test.mjs scripts/cli-env-boundary.test.mjs scripts/container-boundary.test.mjs scripts/dependency-patch-boundary.test.mjs scripts/dependency-update-boundary.test.mjs scripts/gitleaks-config-boundary.test.mjs scripts/media-metadata-boundary.test.mjs scripts/opsec-boundary.test.mjs scripts/platform-config-boundary.test.mjs scripts/publication-policy-boundary.test.mjs scripts/public-docs-contract.test.mjs scripts/public-git-metadata.test.mjs scripts/public-package-docs-contract.test.mjs scripts/public-product-boundary.test.mjs scripts/release-boundary.test.mjs scripts/repository-layout.test.mjs scripts/secret-scanning-boundary.test.mjs scripts/source-comment-hygiene.test.mjs scripts/verify-eas-archive.test.mjs scripts/verify-live-test-report.test.mjs scripts/verify-upstream-import.test.mjs
      - name: Verify complete change delta
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | head -n 1)"
            scripts/check-upstream-cruft.sh
            node scripts/check-public-git-metadata.mjs --root "$BASE_SHA"
            git diff-tree --check --root "$BASE_SHA"
            if [[ "$BASE_SHA" != "$HEAD_SHA" ]]; then
              node scripts/verify-upstream-import.mjs --ci-range "$BASE_SHA" "$HEAD_SHA"
            else
              echo "Initial root commit has no delta base; enforcing the exact full-tree baseline."
            fi
          else
            node scripts/verify-upstream-import.mjs --ci-range "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Verify generic publication boundary
        run: bash scripts/check-docs-hygiene.sh
